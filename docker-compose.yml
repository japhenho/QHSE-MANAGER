# Services de développement local uniquement (pas une configuration de production).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qhse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-qhse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qhse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qhse} -d ${POSTGRES_DB:-qhse_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qhse_pgdata:
