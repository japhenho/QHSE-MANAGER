name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway credentials of the CI database service: not secrets.
      TEST_DATABASE_URL: postgresql://qhse_app:ci-app-not-a-secret@localhost:5432/qhse_test?schema=public
      TEST_MIGRATION_DATABASE_URL: postgresql://qhse_owner:ci-owner-not-a-secret@localhost:5432/qhse_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create database roles and test database
        run: pnpm db:init
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-not-a-secret
          DB_OWNER_PASSWORD: ci-owner-not-a-secret
          DB_APP_PASSWORD: ci-app-not-a-secret
          DB_NAMES: qhse_test
          DB_OWNER_CREATEDB: 'true'
      # Applies the migrations with the owner role, then runs the API against the
      # runtime role. Fails (never skips) when the database is unreachable.
      - run: pnpm test:e2e
